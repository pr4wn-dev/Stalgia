name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make clang \
            gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 \
            mingw-w64-x86-64-dev binutils-mingw-w64-x86-64

      - name: Configure
        run: cmake -S . -B build-mingw -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-mingw -j

      # CPU art-direction checks (C1–C16 and the stair-step ground check).
      # The stair check rejects the flat hash steps; the pass-1 look still fails C1 and C8.
      - name: Scene checks
        run: |
          pip install numpy pillow
          python3 tools/render_sky.py --check --scale 0.5 --out /tmp/stills

      # Unsigned exe. Artifact name is stable so a SignPath signing step can
      # be inserted later: submit Stalgia-unsigned, then publish the signed file.
      - name: Upload unsigned exe
        uses: actions/upload-artifact@v4
        with:
          name: Stalgia-unsigned
          path: build-mingw/Stalgia.exe
          if-no-files-found: error
